name: crypto-usdt-pay
x-app: &app
  image: crypto-usdt-pay:local
  build:
    context: .
    target: app
  env_file: .env
  environment:
    DB_CONNECTION: pgsql
    DB_HOST: postgres
    DB_PORT: 5432
    REDIS_CLIENT: phpredis
    REDIS_HOST: redis
    QUEUE_CONNECTION: redis
    CACHE_STORE: redis
    SESSION_DRIVER: redis
  volumes:
    - app_storage:/var/www/html/storage
  restart: unless-stopped
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
services:
  app:
    <<: *app
  worker:
    <<: *app
    command: [php, artisan, queue:work, redis, "--queue=default,notifications,callbacks,invoices", "--tries=5", "--timeout=90", "--max-time=3600"]
    stop_grace_period: 100s
  scheduler:
    <<: *app
    command: [php, artisan, schedule:work]
    stop_grace_period: 100s
  web:
    build:
      context: .
      target: web
    volumes:
      - app_storage:/var/www/html/storage:ro
    depends_on: [app]
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
  caddy:
    image: caddy:2-alpine
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?Set APP_DOMAIN}
    ports: ["80:80", "443:443"]
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [web]
    restart: unless-stopped
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${DB_DATABASE:?Set DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME:?Set DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  redis:
    image: redis:7-alpine
    command: [redis-server, --appendonly, "yes"]
    volumes: ["redis_data:/data"]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
volumes:
  postgres_data:
  redis_data:
  app_storage:
  caddy_data:
  caddy_config:
