name: MVP verification
on: [push, pull_request]
permissions:
  contents: read
jobs:
  payments:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: payments_test
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U test" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: payments_test
      DB_USERNAME: test
      DB_PASSWORD: test
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_pgsql, mbstring, gd, zip, bcmath, pcntl
          coverage: none
      - run: cp .env.example .env
      - run: composer install --prefer-dist --no-interaction
      - run: php vendor/bin/pest tests/Feature/PaymentSafetyTest.php
  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: docker build --target app -t crypto-usdt-pay:ci .
      - run: docker build --target web -t crypto-usdt-pay-web:ci .
